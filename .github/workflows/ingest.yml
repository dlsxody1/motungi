name: Data Ingest (batch)

# 공공데이터 → Supabase 배치 적재 (기획서 §9). 별도 서버·스케줄러 없이 크론으로.
# TODO: scripts/ingest 구현 후 활성화. 지금은 스캐폴드.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # 매일 03:00 KST (UTC+9)

jobs:
  ingest:
    runs-on: ubuntu-latest
    if: false # 파이프라인 구현 전까지 비활성
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # - run: pnpm --filter @motungi/core exec tsx scripts/ingest.ts
      #   env:
      #     # 이름은 .env / .env.example과 반드시 일치해야 한다(예전엔 DATA_GO_KR_API_KEY로
      #     # 어긋나 있어, 활성화했다면 키가 안 들어간 채로 돌 뻔했다).
      #     SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      #     NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      #     DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      #     SEOUL_OPENAPI_KEY: ${{ secrets.SEOUL_OPENAPI_KEY }}
