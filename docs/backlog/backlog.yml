      안에서 무검증 fetch(redirect:"follow")를 돈다. 상류(data.go.kr 공공데이터)가 오염되면
      내부망 스캔에 쓰일 수 있는 blind SSRF primitive. 이미 같은 필드에 대해 읽기 경로를
      고친 선례가 있으므로 적재 경로에도 동일 패턴을 적용하면 된다(신규 설계 불필요).
