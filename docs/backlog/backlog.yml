  - id: M-049
    title: "진단 Q1(관심사) 다중선택 — core는 이미 배열인데 UI만 단일선택"
    priority: medium
    status: doing
    scope: [packages/core/src/diagnosis.ts, apps/web/src/app/diagnosis/page.tsx, apps/mobile/app/diagnosis.tsx]
    done_when:
