      - "시뮬레이션된 /api/why-reasons 실패에 대해 캡처된 Sentry 이벤트/breadcrumb에 key=·serviceKey= 류 쿼리 파라미터가 없음을 테스트 또는 수동 확인으로 검증한다"
      - "pnpm --filter web typecheck · test 통과"
    notes: >
