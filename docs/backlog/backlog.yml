      키가 새어나갈 수 있다. 현재는 키 미등록이라 no_key 폴백만 타지만 등록 전에
      고쳐두는 게 안전하다.
      [2026-08-31 야간 파이프라인 완료] why-reasons/route.ts의 Gemini fetch를 ?key=
      쿼리에서 x-goog-api-key 헤더로 교체(URL에 키가 더 이상 안 남음). sentry.server.
