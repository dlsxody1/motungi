  - id: M-044
    title: "LLM 계층 — 추천 근거 생성(주력) + 자연어 의도 파싱(보조)"
    priority: medium
    status: todo
    scope: [apps/web/src/app/api, packages/core/src/view.ts, packages/core/src/scoring.ts(무변경 유지)]
    done_when:
      - "폴백을 **먼저** 세운다 — LLM을 429/500으로 강제 목킹했을 때 whyReasons로 떨어지고 UI가 정상 렌더되는 테스트가 있다"
      - "근거 생성 입력은 raw row가 아니라 scoring의 breakdown이다 — 점수를 환각할 수 없는 구조임을 테스트로 고정한다"
      - "같은 카테고리 20행의 근거 문자열 유니크 비율이 개선된다(현재는 사실상 1종)"
      - "GEMINI_API_KEY는 서버 전용 — NEXT_PUBLIC_/EXPO_PUBLIC_ 접두어가 붙지 않는다"
      - "규칙 엔진 결과를 즉시 렌더하고 LLM 산문은 나중에 채운다 — 페이지가 모델 응답에 블로킹되지 않는다"
      - "요청당 토큰 수와 폴백률을 남긴다"
    notes: >
      방향 결정 근거(2026-08-03 실측): 코퍼스가 445행 중 54행(12.1%)뿐이라 검색형 RAG를 주력으로
      두지 않는다 — 391행이 색인에서 빠지면 결과가 부실할 때 데이터 부재인지 알고리즘 문제인지
      구분이 안 된다. 반면 근거 생성은 scoring의 breakdown(거리·비용·시간·난이도)을 입력으로 써서
      445행 전부에 동작한다(description 유무 무관).
      대체 대상: packages/core/src/view.ts:284-332 whyReasons()는 4분기 if/else 고정 문자열이라
      같은 카테고리·같은 비용 버킷이면 바이트 단위로 동일한 문구가 나온다.
      **whyReasons는 지우지 말고 폴백으로 유지** — 이미 테스트됐고 빈 배열을 반환하지 않음을 보장한다.
      모델은 Gemini Flash 무료 티어(비용 0, rate limit 존재) → 429를 정상 경로로 취급해
      폴백을 먼저 구현할 것. pgvector는 이 규모에서 과투자라 쓰지 않는다.
