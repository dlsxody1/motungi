      회귀·다른 호출부 대비 방어선으로 유지). done_when 3번째 항목("시뮬레이션된 실패에
      대한 검증")은 신규 apps/web/sentry.server.config.test.ts(6 tests)로 자동화 —
      Sentry.init을 모킹해 beforeBreadcrumb/beforeSend를 직접 호출하는 방식이라 수동
      확인이 아니라 테스트로 고정했다. 커밋 306e18c, dev 직접 커밋(트렁크 모델, PR 없음).
      qa 게이트 PASS. M-076과 같은 밤 같은 파일(why-reasons/route.ts)을 건드렸지만
      회귀 없게 커밋은 분리(M-076 커밋에 먼저 반영된 rate-limit/길이제한 위에 이 커밋의
